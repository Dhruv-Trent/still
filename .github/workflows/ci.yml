name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/still-server.log 2>&1 &
      - run: node scripts/wait-for-server.mjs
      - run: npm run test:ui:serve > /tmp/still-fixture.log 2>&1 &
      - run: node scripts/wait-for-server.mjs http://127.0.0.1:3001
      - run: E2E_COMPONENTS=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
